version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: researchgraph-db
    environment:
      POSTGRES_DB: researchgraph_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchgraph-backend
    environment:
      DJANGO_SECRET_KEY: docker-compose-insecure-key-researchgraph-ai
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: postgres
      POSTGRES_DB: researchgraph_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:latest
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./sample_documents:/app/sample_documents
      - ./sample_evaluation:/app/sample_evaluation
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: researchgraph-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
